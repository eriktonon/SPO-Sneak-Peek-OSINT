<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPO — Operator Provisioned // Datadog Cloud SIEM</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/datadog-druids.css') }}" />
</head>
<body class="cds-auth-body">
  <main class="cds-auth-main">
    <section class="cds-auth-card" style="border-top-color:#24a148;" aria-labelledby="ok-h1">
      <div class="cds-panel-header">
        <span class="cds-panel-header-title">PROVISIONING COMPLETE</span>
        <span class="cds-tag cds-tag-green">PBKDF2-SHA256</span>
      </div>
      <div class="cds-panel-body">
        <h1 id="ok-h1" class="cds-page-h1" style="font-size:22px;"><strong>Operator Account Created</strong></h1>
        <p style="font-size:13.5px;color:var(--cds-text-secondary);">
          Your operator credentials have been salted and hashed with PBKDF2-SHA256 and committed to the local SQLite WAL vault.
        </p>
        <a href="{{ url_for('login') }}" class="cds-btn cds-btn-primary" style="width:100%;">
          <span>Proceed to Operator Login</span>
          <span class="mono" aria-hidden="true">&rarr;</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
