<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPO — Authentication Failed // SP Sneak Peek OSINT</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sp-theme.css') }}" />

<body class="cds-auth-body">
  <main class="cds-auth-main">
    <section class="cds-auth-card" style="border-top-color:#da1e28;" aria-labelledby="fail-h1">
      <div class="cds-panel-header">
        <span class="cds-panel-header-title">AUTHENTICATION REJECTED // OWASP A07</span>
        <span class="cds-tag cds-tag-red">DENIED</span>
      </div>
      <div class="cds-panel-body">
        <h1 id="fail-h1" class="cds-page-h1" style="font-size:22px;"><strong>Authentication</strong> Failed</h1>
        <p style="font-size:13.5px;color:var(--cds-text-secondary);">
          Invalid operator username or password. This attempt has been logged by the OWASP A09 Security Telemetry Audit Trail.
        </p>
        <a href="{{ url_for('login') }}" class="cds-btn cds-btn-danger" style="width:100%;">
          <span>Return to Operator Login</span>
          <span class="mono" aria-hidden="true">&rarr;</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
