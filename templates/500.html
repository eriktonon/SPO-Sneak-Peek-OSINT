<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/carbon-v11.css') }}" />
</head>
<body class="cds-auth-body">

        <a href="{{ url_for('login') }}" class="cds-btn cds-btn-primary" style="width:100%;">Return to Console &rarr;</a>
