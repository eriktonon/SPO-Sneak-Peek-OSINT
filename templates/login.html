<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SP — Sneak Peek OSINT — Operator Authentication</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sp-theme.css') }}" />
</head>
<body class="cds-auth-body">
  <header style="padding:12px 24px;background:#191229;border-bottom:1px solid #2d2147;" class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="dd-brand-logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <circle cx="12" cy="11" r="3" fill="#10B981" stroke="none"/>
        </svg>
      </div>
      <div>
        <div style="color:#ffffff;font-weight:700;font-size:13.5px;">SP — Sneak Peek OSINT &amp; OSINT Observability</div>
        <div class="mono" style="color:#c4b5fd;font-size:10px;">SP Dark/Light SECOPS EDITION &bull; v2.0.0</div>
      </div>
    </div>
    <span class="cds-tag cds-tag-purple">PBKDF2-SHA256 &bull; RATE-LIMITED</span>
  </header>

  <main class="cds-auth-main" role="main">
    <section class="cds-auth-card" aria-labelledby="login-h1">
      <div class="cds-panel-header">
        <span class="cds-panel-header-title">SP // OPERATOR SIGN IN</span>
        <span class="cds-tag cds-tag-green">VAULT ONLINE</span>
      </div>
      <form action="{{ url_for('login') }}" method="POST" class="cds-panel-body">
        <div>
          <h1 id="login-h1" class="cds-page-h1" style="font-size:21px;"><strong>Operator</strong> Authentication</h1>
          <p class="text-xs text-secondary mt-1">
            Authenticate to access the OSINT Telemetry Board, Strix DAST Scanner, and Granite 4.2 Granite 4.2 AI.
          </p>
        </div>

        <div class="cds-form-group">
          <label for="login-user" class="cds-label">OPERATOR HANDLE</label>
          <input id="login-user" type="text" name="user" required autocomplete="username" class="cds-input" placeholder="eriktonon" />
        </div>

        <div class="cds-form-group">
          <label for="login-password" class="cds-label">PASSPHRASE</label>
          <input id="login-password" type="password" name="password" required autocomplete="current-password" class="cds-input" placeholder="••••••••••••" />
        </div>

        <button type="submit" class="cds-btn cds-btn-primary w-full mt-2">
          <span>Sign In to SP</span>
          <span class="mono" aria-hidden="true">&rarr;</span>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
