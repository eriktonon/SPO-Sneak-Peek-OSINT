      <span class="cds-header-divider" aria-hidden="true"></span>
      <span class="cds-header-title"><strong>SPO — Sneak Peek OSINT v2.0</strong> // Operator Access</span>
    </div>
  </header>

  <main class="cds-auth-main" style="padding-top:72px;">
    <section class="cds-auth-card" aria-labelledby="login-h1">
      <div class="cds-panel-header">
        <span class="cds-panel-header-title">AUTHENTICATION GATEWAY // PBKDF2-SHA256</span>
        <span class="cds-tag cds-tag-blue">CARBON v11</span>
      </div>
      <div class="cds-panel-body">
        <div>
          <div class="cds-eyebrow">TACTICAL RECONNAISSANCE CONTROL PLANE</div>
          <h1 id="login-h1" class="cds-page-h1" style="font-size:24px;margin-top:4px;"><strong>Sign in</strong> to Sneak Peek OSINT</h1>
        </div>

        <form action="{{ url_for('login') }}" method="POST" style="display:flex;flex-direction:column;gap:16px;">
          <div class="cds-field-group">
            <label for="user" class="cds-label">Operator Username</label>
            <input name="user" id="user" type="text" required autocomplete="username" placeholder="eriktonon" class="cds-input" />
          </div>
          <div class="cds-field-group">
            <label for="password" class="cds-label">Password</label>
            <input name="password" id="password" type="password" required autocomplete="current-password" placeholder="••••••••••••" class="cds-input" />
          </div>
          <button type="submit" class="cds-btn cds-btn-primary" style="width:100%;">
            <span>Authenticate Session</span>
            <span class="mono" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
