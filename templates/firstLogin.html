<!DOCTYPE html>
<html lang="en" class="dark">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <title>SPO — Initialize Operator Account</title>
   <link rel="icon" href="{{ url_for('static', filename='img/spoICO.png') }}" type="image/png" />
   <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
   <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex items-center justify-center p-4">
   <div class="w-full max-w-md bg-[#111827] border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-6">
         <div class="w-14 h-14 mx-auto rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 mb-3">
            <i class="material-icons text-3xl">person_add</i>
         </div>
         <h1 class="font-mono font-bold tracking-widest text-lg text-white">INITIALIZE OPERATOR</h1>
         <p class="text-xs text-slate-400 mt-1">Create your local SPO administrator account (PBKDF2-SHA256).</p>
      </div>

      <form action="{{ url_for('firstLogin') }}" method="POST" class="space-y-4">
         <div>
            <label for="user" class="block text-xs font-mono uppercase text-slate-400 mb-1.5">New Operator Username</label>
            <input name="user" id="user" type="text" required pattern="[a-zA-Z0-9_\-\.]+" placeholder="admin"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-cyan-500">
         </div>
         <div>
            <label for="passwd" class="block text-xs font-mono uppercase text-slate-400 mb-1.5">Password</label>
            <input name="password" id="passwd" type="password" required placeholder="••••••••"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-cyan-500">
         </div>
         <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 px-4 rounded-lg transition">
            Create Operator Account
         </button>
      </form>
   </div>
</body>
</html>
